name: Royal Motors Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy website to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          protocol: ftp
          port: 21
          # Since Hostinger FTP accounts default directly inside public_html, use ./ to deploy to root
          server-dir: ./
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            node_modules/
            node_modules/**
            migrations/
            migrations/**
            server/
            server/**
            .grok/
            .grok/**
            scripts/
            scripts/**
            *.mjs
            *.json
            *.ts
            *.tsx
